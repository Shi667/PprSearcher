<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Research Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fafaf9;
        --surface: #ffffff;
        --border: #e7e5e4;
        --text: #1c1917;
        --text-secondary: #78716c;
        --accent: #0f766e;
        --accent-light: #ccfbf1;
        --accent-hover: #0d9488;
        --error: #dc2626;
        --error-light: #fee2e2;
        --radius: 8px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.08);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }

      /* ── Header ── */
      header {
        text-align: center;
        margin-bottom: 2.5rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border);
      }

      header h1 {
        font-family: "Lora", Georgia, serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 0.4rem;
      }

      header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      /* ── Architecture Diagram ── */
      .arch-diagram {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.25rem;
        margin-bottom: 2rem;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .arch-diagram code {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.8rem;
        color: var(--text-secondary);
        white-space: pre;
        line-height: 1.5;
      }

      /* ── Input Section ── */
      .input-section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 2rem;
        box-shadow: var(--shadow);
      }

      .input-row {
        display: flex;
        gap: 0.75rem;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        flex: 1;
        min-width: 200px;
      }

      .input-group.small {
        flex: 0 0 120px;
        min-width: 120px;
      }

      .input-group label {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .input-group input {
        padding: 0.6rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
        color: var(--text);
        background: var(--bg);
        transition: border-color 0.2s;
        outline: none;
      }

      .input-group input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-light);
      }

      .input-group input[type="number"] {
        text-align: center;
      }

      .btn-primary {
        padding: 0.6rem 1.5rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        white-space: nowrap;
        height: 42px;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .btn-primary:active:not(:disabled) {
        transform: scale(0.98);
      }

      .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ── Progress Panel ── */
      .progress-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 2rem;
        box-shadow: var(--shadow);
        display: none;
      }

      .progress-panel.visible {
        display: block;
      }

      .progress-header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .progress-header h3 {
        font-size: 0.85rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-secondary);
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.8);
        }
      }

      .progress-list {
        max-height: 300px;
        overflow-y: auto;
        padding: 0.5rem 0;
      }

      .progress-item {
        padding: 0.5rem 1.25rem;
        font-size: 0.88rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        animation: fadeIn 0.3s ease;
        border-left: 3px solid transparent;
      }

      .progress-item.research {
        border-left-color: #2563eb;
      }
      .progress-item.read {
        border-left-color: #7c3aed;
      }
      .progress-item.synthesize {
        border-left-color: #059669;
      }
      .progress-item.critique {
        border-left-color: #d97706;
      }
      .progress-item.info {
        border-left-color: var(--border);
      }
      .progress-item.error {
        border-left-color: var(--error);
        background: var(--error-light);
      }

      .progress-item .icon {
        font-size: 1rem;
        flex-shrink: 0;
      }
      .progress-item .time {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-left: auto;
        flex-shrink: 0;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Synthesis Section ── */
      .synthesis-section {
        display: none;
        animation: fadeIn 0.5s ease;
      }

      .synthesis-section.visible {
        display: block;
      }

      .synthesis-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .synthesis-header h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 1.4rem;
        font-weight: 600;
      }

      .btn-download {
        padding: 0.5rem 1.2rem;
        background: var(--text);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .btn-download:hover {
        opacity: 0.85;
      }
      .btn-download:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .synthesis-content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2rem 2.5rem;
        box-shadow: var(--shadow-lg);
        font-family: "Lora", Georgia, serif;
        font-size: 1rem;
        line-height: 1.75;
      }

      /* ── Markdown Styling ── */
      .synthesis-content h1 {
        font-family: "Lora", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 2rem 0 0.75rem;
        padding-bottom: 0.4rem;
        border-bottom: 2px solid var(--accent);
        color: var(--text);
      }

      .synthesis-content h1:first-child {
        margin-top: 0;
      }

      .synthesis-content h2 {
        font-family: "Lora", Georgia, serif;
        font-size: 1.15rem;
        font-weight: 600;
        margin: 1.5rem 0 0.5rem;
        color: var(--accent);
      }

      .synthesis-content h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 1.2rem 0 0.4rem;
      }

      .synthesis-content p {
        margin-bottom: 0.75rem;
      }

      .synthesis-content strong {
        font-weight: 600;
      }

      .synthesis-content a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .synthesis-content ul,
      .synthesis-content ol {
        margin: 0.5rem 0 1rem 1.5rem;
      }

      .synthesis-content li {
        margin-bottom: 0.3rem;
      }

      .synthesis-content hr {
        border: none;
        border-top: 1px solid var(--border);
        margin: 2rem 0;
      }

      .synthesis-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-family: "Inter", sans-serif;
        font-size: 0.88rem;
      }

      .synthesis-content th,
      .synthesis-content td {
        padding: 0.6rem 0.8rem;
        border: 1px solid var(--border);
        text-align: left;
      }

      .synthesis-content th {
        background: var(--bg);
        font-weight: 600;
      }

      .synthesis-content blockquote {
        border-left: 3px solid var(--accent);
        padding: 0.5rem 1rem;
        margin: 1rem 0;
        background: var(--accent-light);
        border-radius: 0 var(--radius) var(--radius) 0;
        font-style: italic;
      }

      .synthesis-content code {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.88em;
        background: var(--bg);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }

      .synthesis-content pre {
        background: #1c1917;
        color: #e7e5e4;
        padding: 1rem;
        border-radius: var(--radius);
        overflow-x: auto;
        margin: 1rem 0;
      }

      .synthesis-content pre code {
        background: none;
        padding: 0;
        color: inherit;
      }

      /* ── Error Toast ── */
      .error-toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--error);
        color: #fff;
        padding: 0.8rem 1.2rem;
        border-radius: var(--radius);
        font-size: 0.9rem;
        box-shadow: var(--shadow-lg);
        animation: fadeIn 0.3s ease;
        display: none;
        z-index: 100;
      }

      .error-toast.visible {
        display: block;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .container {
          padding: 1rem;
        }
        .synthesis-content {
          padding: 1.25rem;
        }
        .input-row {
          flex-direction: column;
        }
        .input-group.small {
          flex: 1;
        }
        .btn-primary {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Deep Research Agent</h1>
        <p>
          Autonomous state-of-the-art review generation via LangGraph, Groq
          &amp; arXiv
        </p>
      </header>

      <div class="arch-diagram">
        <code
          >START → Research → Read → Synthesize → Critic ─┐ │ └── (if gaps
          found, loop back) ─────────────┘ └── (if approved) → END</code
        >
      </div>

      <div class="input-section">
        <div class="input-row">
          <div class="input-group">
            <label for="topic">Research Topic</label>
            <input
              type="text"
              id="topic"
              placeholder="e.g., argument mining in legal texts"
            />
          </div>
          <div class="input-group small">
            <label for="num-papers">Papers</label>
            <input type="number" id="num-papers" min="1" max="20" value="5" />
          </div>
          <button class="btn-primary" id="start-btn" onclick="startResearch()">
            Start Research
          </button>
        </div>
      </div>

      <div class="progress-panel" id="progress-panel">
        <div class="progress-header">
          <div class="pulse-dot" id="pulse-dot"></div>
          <h3>Live Progress</h3>
        </div>
        <div class="progress-list" id="progress-list"></div>
      </div>

      <div class="synthesis-section" id="synthesis-section">
        <div class="synthesis-header">
          <h2>Paper Summaries</h2>
          <button
            class="btn-download"
            id="download-btn"
            onclick="downloadPDF()"
          >
            <span>📄</span> Download as PDF
          </button>
        </div>
        <div class="synthesis-content" id="synthesis-content"></div>
      </div>
    </div>

    <div class="error-toast" id="error-toast"></div>

    <script>
      const ICONS = {
        research: "🔍",
        read: "📖",
        synthesize: "📝",
        critique: "⚖️",
        info: "ℹ️",
        error: "❌",
      };

      let currentSynthesis = "";
      let currentTopic = "";

      function showError(msg) {
        const toast = document.getElementById("error-toast");
        toast.textContent = msg;
        toast.classList.add("visible");
        setTimeout(() => toast.classList.remove("visible"), 5000);
      }

      function addProgressItem(stage, message) {
        const list = document.getElementById("progress-list");
        const item = document.createElement("div");
        item.className = `progress-item ${stage}`;

        const now = new Date();
        const time = now.toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });

        item.innerHTML = `
                <span class="icon">${ICONS[stage] || "ℹ️"}</span>
                <span>${message}</span>
                <span class="time">${time}</span>
            `;
        list.appendChild(item);
        list.scrollTop = list.scrollHeight;
      }

      async function startResearch() {
        const topic = document.getElementById("topic").value.trim();
        const numPapers =
          parseInt(document.getElementById("num-papers").value) || 5;

        if (!topic) {
          showError("Please enter a research topic.");
          return;
        }

        if (numPapers < 1 || numPapers > 20) {
          showError("Number of papers must be between 1 and 20.");
          return;
        }

        currentTopic = topic;
        currentSynthesis = "";

        const btn = document.getElementById("start-btn");
        btn.disabled = true;
        btn.textContent = "Running...";

        const panel = document.getElementById("progress-panel");
        const list = document.getElementById("progress-list");
        const synthSection = document.getElementById("synthesis-section");

        panel.classList.add("visible");
        synthSection.classList.remove("visible");
        list.innerHTML = "";
        document.getElementById("pulse-dot").style.display = "block";

        addProgressItem(
          "info",
          `Starting research on "${topic}" (${numPapers} papers)...`,
        );

        try {
          const response = await fetch("/api/research", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic: topic, num_papers: numPapers }),
          });

          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.detail || "Server error");
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              if (!line.startsWith("data: ")) continue;
              const jsonStr = line.slice(6).trim();
              if (!jsonStr) continue;

              try {
                const event = JSON.parse(jsonStr);

                if (event.type === "progress") {
                  addProgressItem(event.stage, event.message);
                } else if (event.type === "result") {
                  currentSynthesis = event.synthesis;
                  const content = document.getElementById("synthesis-content");
                  content.innerHTML = marked.parse(event.synthesis);
                  synthSection.classList.add("visible");
                  addProgressItem("info", "Research complete!");
                } else if (event.type === "error") {
                  addProgressItem("error", event.message);
                  showError(event.message);
                }
              } catch (e) {
                // skip malformed JSON
              }
            }
          }
        } catch (err) {
          addProgressItem("error", err.message);
          showError(err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Start Research";
          document.getElementById("pulse-dot").style.display = "none";
        }
      }

      async function downloadPDF() {
        if (!currentSynthesis) {
          showError("No synthesis available to download.");
          return;
        }

        const btn = document.getElementById("download-btn");
        btn.disabled = true;
        btn.innerHTML = "<span>⏳</span> Generating PDF...";

        try {
          const response = await fetch("/api/download-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              synthesis: currentSynthesis,
              topic: currentTopic,
            }),
          });

          if (!response.ok) {
            let errMsg = "PDF generation failed";
            try {
              const err = await response.json();
              errMsg = err.detail || errMsg;
            } catch (e) {
              const text = await response.text();
              errMsg = text || errMsg;
            }
            throw new Error(errMsg);
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          const safeTopic = currentTopic
            .replace(/[^a-zA-Z0-9\s]/g, "")
            .trim()
            .replace(/\s+/g, "_")
            .substring(0, 40);
          a.download = `research_report_${safeTopic}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (err) {
          showError("PDF download failed: " + err.message);
        } finally {
          btn.disabled = false;
          btn.innerHTML = "<span>📄</span> Download as PDF";
        }
      }

      // Allow Enter key to start research
      document.getElementById("topic").addEventListener("keydown", (e) => {
        if (e.key === "Enter") startResearch();
      });
    </script>
  </body>
</html>
