<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Research Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <style>
      :root {
        --bg: #fafaf9;
        --surface: #fff;
        --sunk: #f4f4f2;
        --line: #e7e5e4;
        --text: #1c1917;
        --muted: #78716c;
        --accent: #0f766e;
        --accent-hover: #0d6b64;
        --accent-soft: #e3f3f1;
        --err: #b42318;
        --err-soft: #fdecea;
        --serif: "Lora", Georgia, serif;
        --sans: "Inter", system-ui, sans-serif;
        --r: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151413;
          --surface: #1c1b1a;
          --sunk: #242321;
          --line: #34322f;
          --text: #ece9e6;
          --muted: #a29d97;
          --accent: #2dd4bf;
          --accent-hover: #5eead4;
          --accent-soft: #123532;
          --err: #f87171;
          --err-soft: #3a1c1a;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font: 15px/1.6 var(--sans);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 24px 120px;
      }

      /* Header */
      header h1 {
        font: 600 34px/1.15 var(--serif);
        letter-spacing: -0.02em;
      }
      header p {
        margin-top: 8px;
        color: var(--muted);
      }

      /* Composer: one quiet surface holding topic, paper count and the action */
      .composer {
        margin-top: 36px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 6px 6px 16px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .composer:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      #topic {
        flex: 1;
        min-width: 0;
        border: 0;
        background: none;
        padding: 10px 0;
        outline: none;
        font-size: 16px;
      }
      #topic::placeholder {
        color: var(--muted);
      }
      .count {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-left: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
      #num-papers {
        width: 38px;
        border: 0;
        background: none;
        text-align: right;
        outline: none;
        -moz-appearance: textfield;
      }
      #num-papers::-webkit-inner-spin-button {
        display: none;
      }
      .btn {
        border: 0;
        border-radius: 7px;
        padding: 10px 20px;
        background: var(--accent);
        color: #fff;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }
      @media (prefers-color-scheme: dark) {
        .btn {
          color: #0b1f1d;
        }
      }
      .btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.quiet {
        background: none;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 7px 14px;
        font-size: 13.5px;
      }
      .btn.quiet:hover:not(:disabled) {
        background: var(--sunk);
        color: var(--text);
      }
      @media (max-width: 560px) {
        .composer {
          flex-wrap: wrap;
          padding: 12px;
        }
        #topic {
          flex-basis: 100%;
        }
        .count {
          border: 0;
          padding: 0 8px 0 0;
          flex: 1;
        }
      }

      .examples {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .examples button {
        border: 1px solid var(--line);
        background: none;
        color: var(--muted);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .examples button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* Run panel: stepper + current status + collapsible activity log */
      #run {
        display: none;
        margin-top: 40px;
      }
      #run.on {
        display: block;
      }
      .stepper {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .step {
        padding-top: 10px;
        border-top: 2px solid var(--line);
        font-size: 13.5px;
        color: var(--muted);
        transition:
          border-color 0.3s,
          color 0.3s;
      }
      .step.active {
        border-color: var(--accent);
        color: var(--text);
        font-weight: 500;
      }
      .step.done {
        border-color: var(--accent);
      }
      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        min-height: 28px;
      }
      .dot {
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.4s ease-in-out infinite;
      }
      .status.idle .dot {
        animation: none;
        background: var(--line);
      }
      .status.fail .dot {
        animation: none;
        background: var(--err);
      }
      #status-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #meta {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
          transform: scale(0.7);
        }
      }

      details {
        margin-top: 12px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13.5px;
        width: fit-content;
      }
      summary:hover {
        color: var(--text);
      }
      #log {
        margin-top: 10px;
        max-height: 260px;
        overflow-y: auto;
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: 24px 1fr auto;
        gap: 8px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
        animation: in 0.3s ease;
      }
      .row time {
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .row.error {
        color: var(--err);
      }
      @keyframes in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Result */
      #result {
        display: none;
        margin-top: 56px;
        animation: in 0.5s ease;
      }
      #result.on {
        display: block;
      }
      .result-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .result-head h2 {
        font: 600 22px var(--serif);
        letter-spacing: -0.01em;
      }
      .result-head .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }
      .tools {
        display: flex;
        gap: 8px;
      }
      #synthesis {
        padding-top: 28px;
      }

      .md {
        font-family: var(--serif);
        font-size: 17px;
        line-height: 1.78;
        max-width: 68ch;
      }
      .md > * + * {
        margin-top: 1em;
      }
      .md h1,
      .md h2,
      .md h3,
      .md h4 {
        line-height: 1.3;
        letter-spacing: -0.01em;
        margin-top: 1.9em;
        font-weight: 600;
      }
      .md h1 {
        font-size: 28px;
        margin-top: 0;
      }
      .md h2 {
        font-size: 22px;
      }
      .md h3 {
        font-size: 18.5px;
      }
      .md h4 {
        font-size: 17px;
      }
      .md a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      .md ul,
      .md ol {
        padding-left: 1.4em;
      }
      .md li + li {
        margin-top: 0.3em;
      }
      .md blockquote {
        padding-left: 18px;
        border-left: 3px solid var(--accent);
        color: var(--muted);
      }
      .md hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2em 0;
      }
      .md code {
        font:
          13px ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        background: var(--sunk);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .md pre {
        background: var(--sunk);
        padding: 14px 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      .md pre code {
        padding: 0;
        background: none;
      }
      .md .tablewrap {
        overflow-x: auto;
        max-width: none;
      }
      .md table {
        border-collapse: collapse;
        width: 100%;
        font: 14px/1.5 var(--sans);
      }
      .md th,
      .md td {
        text-align: left;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .md th {
        font-weight: 600;
        background: var(--sunk);
      }

      /* Toast */
      #toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        background: var(--err-soft);
        color: var(--err);
        border: 1px solid var(--err);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        max-width: min(520px, 90vw);
        display: none;
        z-index: 10;
      }
      #toast.on {
        display: block;
        animation: in 0.25s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>Deep Research Agent</h1>
        <p>
          Autonomous state-of-the-art reviews from arXiv, written and critiqued
          by an agent loop.
        </p>
      </header>

      <div class="composer">
        <input
          id="topic"
          type="text"
          placeholder="e.g., argument mining in legal texts"
          aria-label="Research topic"
          autocomplete="off"
          autofocus
        />
        <label class="count"
          ><input
            id="num-papers"
            type="number"
            min="1"
            max="20"
            value="5"
            aria-label="Number of papers"
          />
          papers</label
        >
        <button class="btn" id="start-btn">Start research</button>
      </div>
      <div class="examples" id="examples">
        <button type="button">argument mining in legal texts</button>
        <button type="button">quantum machine learning benchmarking</button>
        <button type="button">retrieval-augmented generation evaluation</button>
      </div>

      <section id="run" aria-live="polite">
        <div class="stepper" id="stepper">
          <div class="step" data-stage="research">Research</div>
          <div class="step" data-stage="read">Read</div>
          <div class="step" data-stage="synthesize">Synthesize</div>
          <div class="step" data-stage="critique">Critic</div>
        </div>
        <div class="status" id="status">
          <span class="dot"></span><span id="status-text"></span
          ><span id="meta"></span>
        </div>
        <details>
          <summary>Activity log</summary>
          <div id="log"></div>
        </details>
      </section>

      <section id="result">
        <div class="result-head">
          <div>
            <h2>Paper summaries</h2>
            <div class="sub" id="result-sub"></div>
          </div>
          <div class="tools">
            <button class="btn quiet" id="copy-btn">Copy Markdown</button>
            <button class="btn quiet" id="pdf-btn">Download PDF</button>
          </div>
        </div>
        <article class="md" id="synthesis"></article>
      </section>
    </div>
    <div id="toast" role="alert"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const ICONS = {
        research: "🔍",
        read: "📖",
        synthesize: "📝",
        critique: "⚖️",
        info: "·",
        error: "⚠️",
        done: "✅",
      };
      const ORDER = ["research", "read", "synthesize", "critique"];

      let currentSynthesis = "",
        currentTopic = "",
        round = 1,
        reached = -1,
        startedAt = 0,
        timer = null;

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("on");
        clearTimeout(toast.id);
        toast.id = setTimeout(() => t.classList.remove("on"), 5000);
      }

      const fmt = (s) =>
        `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

      function tick() {
        const label = round > 1 ? `Round ${round} · ` : "";
        $("meta").textContent = label + fmt((Date.now() - startedAt) / 1000);
      }

      function setStatus(text, mode = "") {
        $("status").className = "status " + mode;
        $("status-text").textContent = text;
      }

      // Stepper: steps fill as the agent advances; a new Research step after the critic starts another round.
      function advance(stage) {
        const i = ORDER.indexOf(stage);
        if (i < 0) return;
        if (stage === "research" && reached >= 3) {
          round++;
          reached = -1;
        }
        reached = Math.max(reached, i);
        document.querySelectorAll(".step").forEach((el, k) => {
          el.classList.toggle("active", k === reached);
          el.classList.toggle("done", k < reached);
        });
      }

      function addLog(stage, message) {
        const row = document.createElement("div");
        row.className = "row " + (stage === "error" ? "error" : "");
        const icon = document.createElement("span");
        icon.textContent = ICONS[stage] || "·";
        const text = document.createElement("span");
        text.textContent = message;
        const time = document.createElement("time");
        time.textContent = new Date().toLocaleTimeString("en-US", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        row.append(icon, text, time);
        $("log").appendChild(row);
        $("log").scrollTop = $("log").scrollHeight;
      }

      // Wrap tables so wide ones scroll instead of breaking the layout.
      function render(md) {
        const holder = $("synthesis");
        holder.innerHTML = DOMPurify.sanitize(marked.parse(md));
        holder.querySelectorAll("table").forEach((t) => {
          const w = document.createElement("div");
          w.className = "tablewrap";
          t.replaceWith(w);
          w.appendChild(t);
        });
      }

      function handle(ev) {
        if (ev.type === "progress") {
          advance(ev.stage);
          addLog(ev.stage, ev.message);
          setStatus(ev.message);
        } else if (ev.type === "result") {
          currentSynthesis = ev.synthesis || "";
          render(currentSynthesis || "_The agent returned no synthesis._");
          const words = currentSynthesis.trim().split(/\s+/).length;
          $("result-sub").textContent =
            `${currentTopic} · ${Math.max(1, Math.round(words / 220))} min read · ${fmt((Date.now() - startedAt) / 1000)} to generate`;
          $("result").classList.add("on");
          document.querySelectorAll(".step").forEach((el) => {
            el.classList.remove("active");
            el.classList.add("done");
          });
          addLog("done", "Synthesis approved by critic");
          setStatus("Done", "idle");
          $("result").scrollIntoView({ behavior: "smooth", block: "start" });
        } else if (ev.type === "error") {
          addLog("error", ev.message);
          setStatus("The agent stopped: " + ev.message, "fail");
          toast(ev.message);
        }
      }

      async function startResearch() {
        const topic = $("topic").value.trim();
        const n = parseInt($("num-papers").value, 10) || 5;
        if (!topic) {
          toast("Enter a research topic first.");
          $("topic").focus();
          return;
        }
        if (n < 1 || n > 20) {
          toast("Papers must be between 1 and 20.");
          return;
        }

        currentTopic = topic;
        currentSynthesis = "";
        round = 1;
        reached = -1;
        $("start-btn").disabled = true;
        $("start-btn").textContent = "Running…";
        $("examples").style.display = "none";
        $("result").classList.remove("on");
        $("log").innerHTML = "";
        document
          .querySelectorAll(".step")
          .forEach((el) => el.classList.remove("active", "done"));
        $("run").classList.add("on");
        startedAt = Date.now();
        tick();
        timer = setInterval(tick, 1000);
        setStatus(`Starting research on “${topic}”`);
        addLog("info", `Starting research on “${topic}” (${n} papers)`);

        try {
          const res = await fetch("/api/research", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic, num_papers: n }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Server error " + res.status);
          }
          const reader = res.body.getReader(),
            dec = new TextDecoder();
          let buf = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop();
            for (const part of parts) {
              const line = part.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              try {
                handle(JSON.parse(line.slice(6)));
              } catch (_) {
                /* skip malformed event */
              }
            }
          }
        } catch (err) {
          addLog("error", err.message);
          setStatus(err.message, "fail");
          toast(err.message);
        } finally {
          clearInterval(timer);
          tick();
          $("start-btn").disabled = false;
          $("start-btn").textContent = "Start research";
        }
      }

      async function downloadPDF() {
        if (!currentSynthesis)
          return toast("No synthesis available to download.");
        const btn = $("pdf-btn");
        btn.disabled = true;
        btn.textContent = "Generating…";
        try {
          const res = await fetch("/api/download-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              synthesis: currentSynthesis,
              topic: currentTopic,
            }),
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "PDF generation failed");
          }
          const url = URL.createObjectURL(await res.blob());
          const a = Object.assign(document.createElement("a"), {
            href: url,
            download:
              "research_report_" +
              currentTopic
                .replace(/[^a-z0-9\s]/gi, "")
                .trim()
                .replace(/\s+/g, "_")
                .slice(0, 40) +
              ".pdf",
          });
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          toast("PDF download failed: " + err.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Download PDF";
        }
      }

      async function copyMarkdown() {
        try {
          await navigator.clipboard.writeText(currentSynthesis);
          $("copy-btn").textContent = "Copied";
          setTimeout(() => ($("copy-btn").textContent = "Copy Markdown"), 1800);
        } catch (_) {
          toast("Couldn't access the clipboard.");
        }
      }

      $("start-btn").addEventListener("click", startResearch);
      $("pdf-btn").addEventListener("click", downloadPDF);
      $("copy-btn").addEventListener("click", copyMarkdown);
      $("topic").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !$("start-btn").disabled) startResearch();
      });
      $("examples").addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
          $("topic").value = e.target.textContent;
          $("topic").focus();
        }
      });
    </script>
  </body>
</html>
